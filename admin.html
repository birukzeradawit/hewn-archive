<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard &mdash; HEWN Tech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="hewn-tech-logo.jpg" type="image/jpeg">
<link rel="stylesheet" href="style.css?v=9">
<style>
.admin-container {
  max-width: 1200px;
  margin: 40px auto;
  padding: 20px;
}

.admin-header {
  margin-bottom: 30px;
}

.admin-header h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.5rem;
  color: var(--text-primary);
  margin-bottom: 10px;
}

.admin-nav {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
  border-bottom: 2px solid var(--border-medium);
  padding-bottom: 10px;
}

.admin-nav button {
  padding: 10px 20px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.3s ease;
}

.admin-nav button:hover,
.admin-nav button.active {
  color: var(--accent-primary);
  border-bottom-color: var(--accent-primary);
}

.admin-section {
  display: none;
}

.admin-section.active {
  display: block;
}

.admin-form {
  background: var(--bg-secondary);
  padding: 30px;
  border: 1px solid var(--border-light);
  border-radius: 4px;
  margin-bottom: 30px;
}

.admin-form h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  color: var(--text-primary);
  margin-bottom: 20px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: block;
  margin-bottom: 8px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 500;
  color: var(--text-primary);
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--border-medium);
  border-radius: 4px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 1rem;
  background: var(--bg-primary);
  color: var(--text-primary);
}

.form-group textarea {
  min-height: 120px;
  resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--accent-primary);
  box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
}

.admin-button {
  padding: 12px 24px;
  background: var(--accent-primary);
  color: white;
  border: none;
  border-radius: 4px;
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  transition: background 0.3s ease;
}

.admin-button:hover {
  background: var(--accent-secondary);
}

.admin-button.danger {
  background: var(--accent-warning);
}

.admin-button.danger:hover {
  background: #c44;
}

.admin-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg-secondary);
  border: 1px solid var(--border-light);
  border-radius: 4px;
  overflow: hidden;
}

.admin-table th,
.admin-table td {
  padding: 12px 16px;
  text-align: left;
  border-bottom: 1px solid var(--border-light);
}

.admin-table th {
  background: var(--bg-tertiary);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  color: var(--text-primary);
}

.admin-table td {
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.9rem;
  color: var(--text-secondary);
}

.admin-table tr:hover {
  background: var(--bg-tertiary);
}

.action-buttons {
  display: flex;
  gap: 8px;
}

.action-buttons button {
  padding: 6px 12px;
  font-size: 0.8rem;
  cursor: pointer;
  border: none;
  border-radius: 3px;
  transition: opacity 0.2s ease;
}

.action-buttons button:hover {
  opacity: 0.8;
}

.action-buttons .edit {
  background: var(--accent-primary);
  color: white;
}

.action-buttons .delete {
  background: var(--accent-warning);
  color: white;
}

.message {
  padding: 15px;
  border-radius: 4px;
  margin-bottom: 20px;
  display: none;
}

.success-message {
  background: #efe;
  color: #3c3;
  border: 1px solid #3c3;
}

.error-message {
  background: #fee;
  color: #c33;
  border: 1px solid #c33;
}

.message.active {
  display: block;
}
</style>
</head>
<body>

<div class="loc-stripe">
  <div class="stripe-cyan"></div>
  <div class="stripe-orange"></div>
</div>

<div class="archive-bar">
  <div class="wrap archive-bar-inner">
    <span class="repo-loc mono">Addis Ababa, ET &middot; UTC+3</span>
  </div>
</div>

<div class="admin-container">
  <div class="admin-header">
    <h1>Admin Dashboard</h1>
  </div>

  <div class="admin-nav">
    <button class="active" data-section="content">Content</button>
    <button data-section="categories">Categories</button>
    <button data-section="archive">Archive</button>
  </div>

  <div class="message success-message" id="successMessage"></div>
  <div class="message error-message" id="errorMessage"></div>

  <!-- Content Management Section -->
  <div class="admin-section active" id="content-section">
    <div class="admin-form">
      <h2>Add New Content</h2>
      <form id="contentForm">
        <div class="form-row">
          <div class="form-group">
            <label for="contentTitle">Title</label>
            <input type="text" id="contentTitle" name="title" required>
          </div>
          <div class="form-group">
            <label for="contentCategory">Category</label>
            <select id="contentCategory" name="category_id" required>
              <option value="">Select category</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="contentType">Content Type</label>
            <select id="contentType" name="content_type">
              <option value="article">Article</option>
              <option value="document">Document</option>
              <option value="image">Image</option>
              <option value="video">Video</option>
              <option value="audio">Audio</option>
            </select>
          </div>
          <div class="form-group">
            <label for="contentAuthor">Author</label>
            <input type="text" id="contentAuthor" name="author">
          </div>
        </div>
        <div class="form-group">
          <label for="contentDescription">Description</label>
          <textarea id="contentDescription" name="description"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="contentImageUrl">Image URL</label>
            <input type="url" id="contentImageUrl" name="image_url">
          </div>
          <div class="form-group">
            <label for="contentFileUrl">File URL</label>
            <input type="url" id="contentFileUrl" name="file_url">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>
              <input type="checkbox" id="contentPublished" name="published"> Published
            </label>
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" id="contentFeatured" name="featured"> Featured
            </label>
          </div>
        </div>
        <button type="submit" class="admin-button">Add Content</button>
      </form>
    </div>

    <h2>Existing Content</h2>
    <table class="admin-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Category</th>
          <th>Type</th>
          <th>Published</th>
          <th>Featured</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="contentTableBody">
        <tr><td colspan="6">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Categories Section -->
  <div class="admin-section" id="categories-section">
    <div class="admin-form">
      <h2>Add New Category</h2>
      <form id="categoryForm">
        <div class="form-group">
          <label for="categoryName">Category Name</label>
          <input type="text" id="categoryName" name="name" required>
        </div>
        <div class="form-group">
          <label for="categoryDescription">Description</label>
          <textarea id="categoryDescription" name="description"></textarea>
        </div>
        <button type="submit" class="admin-button">Add Category</button>
      </form>
    </div>

    <h2>Existing Categories</h2>
    <table class="admin-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="categoryTableBody">
        <tr><td colspan="3">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Archive Section -->
  <div class="admin-section" id="archive-section">
    <div class="admin-form">
      <h2>Add Archive Item</h2>
      <form id="archiveForm">
        <div class="form-row">
          <div class="form-group">
            <label for="archiveTitle">Title</label>
            <input type="text" id="archiveTitle" name="title" required>
          </div>
          <div class="form-group">
            <label for="archiveCollection">Collection Name</label>
            <input type="text" id="archiveCollection" name="collection_name">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="archiveType">Item Type</label>
            <select id="archiveType" name="item_type">
              <option value="manuscript">Manuscript</option>
              <option value="document">Document</option>
              <option value="photograph">Photograph</option>
              <option value="artifact">Artifact</option>
              <option value="map">Map</option>
            </select>
          </div>
          <div class="form-group">
            <label for="archiveYear">Year</label>
            <input type="number" id="archiveYear" name="year">
          </div>
        </div>
        <div class="form-group">
          <label for="archiveDescription">Description</label>
          <textarea id="archiveDescription" name="description"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="archiveImageUrl">Image URL</label>
            <input type="url" id="archiveImageUrl" name="image_url">
          </div>
          <div class="form-group">
            <label for="archiveDocumentUrl">Document URL</label>
            <input type="url" id="archiveDocumentUrl" name="document_url">
          </div>
        </div>
        <button type="submit" class="admin-button">Add Archive Item</button>
      </form>
    </div>

    <h2>Archive Items</h2>
    <table class="admin-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Collection</th>
          <th>Type</th>
          <th>Year</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="archiveTableBody">
        <tr><td colspan="5">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
// Check authentication
function checkAuth() {
  const token = localStorage.getItem('token');
  const user = JSON.parse(localStorage.getItem('user') || '{}');
  
  if (!token || user.role !== 'admin') {
    alert('Access denied. Admin access required.');
    window.location.href = 'login.html';
    return false;
  }
  return true;
}

// Navigation
document.querySelectorAll('.admin-nav button').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.admin-nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
    
    button.classList.add('active');
    document.getElementById(`${button.dataset.section}-section`).classList.add('active');
  });
});

// Message display
function showMessage(type, message) {
  const messageEl = document.getElementById(`${type}Message`);
  messageEl.textContent = message;
  messageEl.classList.add('active');
  setTimeout(() => messageEl.classList.remove('active'), 5000);
}

// Load categories
async function loadCategories() {
  try {
    const response = await fetch('/api/categories');
    const data = await response.json();
    
    const select = document.getElementById('contentCategory');
    select.innerHTML = '<option value="">Select category</option>' + 
      data.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
    
    // Load category table
    const tbody = document.getElementById('categoryTableBody');
    tbody.innerHTML = data.map(cat => `
      <tr>
        <td>${cat.name}</td>
        <td>${cat.description || '-'}</td>
        <td>
          <div class="action-buttons">
            <button class="delete" onclick="deleteCategory(${cat.id})">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  } catch (error) {
    console.error('Failed to load categories:', error);
  }
}

// Load content
async function loadContent() {
  try {
    const response = await fetch('/api/content');
    const data = await response.json();
    
    const tbody = document.getElementById('contentTableBody');
    tbody.innerHTML = data.map(item => `
      <tr>
        <td>${item.title}</td>
        <td>${item.category_name || '-'}</td>
        <td>${item.content_type || '-'}</td>
        <td>${item.published ? 'Yes' : 'No'}</td>
        <td>${item.featured ? 'Yes' : 'No'}</td>
        <td>
          <div class="action-buttons">
            <button class="edit" onclick="editContent(${item.id})">Edit</button>
            <button class="delete" onclick="deleteContent(${item.id})">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  } catch (error) {
    console.error('Failed to load content:', error);
  }
}

// Load archive items
async function loadArchive() {
  try {
    const response = await fetch('/api/archive');
    const data = await response.json();
    
    const tbody = document.getElementById('archiveTableBody');
    tbody.innerHTML = data.map(item => `
      <tr>
        <td>${item.title}</td>
        <td>${item.collection_name || '-'}</td>
        <td>${item.item_type || '-'}</td>
        <td>${item.year || '-'}</td>
        <td>
          <div class="action-buttons">
            <button class="edit" onclick="editArchive(${item.id})">Edit</button>
            <button class="delete" onclick="deleteArchive(${item.id})">Delete</button>
          </div>
        </td>
      </tr>
    `).join('');
  } catch (error) {
    console.error('Failed to load archive items:', error);
  }
}

// Content form submission
document.getElementById('contentForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData.entries());
  data.published = document.getElementById('contentPublished').checked;
  data.featured = document.getElementById('contentFeatured').checked;
  
  try {
    const response = await fetch('/api/content', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      },
      body: JSON.stringify(data)
    });
    
    if (response.ok) {
      showMessage('success', 'Content added successfully');
      e.target.reset();
      loadContent();
    } else {
      const error = await response.json();
      showMessage('error', error.message || 'Failed to add content');
    }
  } catch (error) {
    showMessage('error', 'Network error');
  }
});

// Category form submission
document.getElementById('categoryForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData.entries());
  
  try {
    const response = await fetch('/api/categories', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      },
      body: JSON.stringify(data)
    });
    
    if (response.ok) {
      showMessage('success', 'Category added successfully');
      e.target.reset();
      loadCategories();
    } else {
      const error = await response.json();
      showMessage('error', error.message || 'Failed to add category');
    }
  } catch (error) {
    showMessage('error', 'Network error');
  }
});

// Archive form submission
document.getElementById('archiveForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const formData = new FormData(e.target);
  const data = Object.fromEntries(formData.entries());
  
  try {
    const response = await fetch('/api/archive', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      },
      body: JSON.stringify(data)
    });
    
    if (response.ok) {
      showMessage('success', 'Archive item added successfully');
      e.target.reset();
      loadArchive();
    } else {
      const error = await response.json();
      showMessage('error', error.message || 'Failed to add archive item');
    }
  } catch (error) {
    showMessage('error', 'Network error');
  }
});

// Delete functions
async function deleteContent(id) {
  if (!confirm('Are you sure you want to delete this content?')) return;
  
  try {
    const response = await fetch(`/api/content/${id}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      }
    });
    
    if (response.ok) {
      showMessage('success', 'Content deleted successfully');
      loadContent();
    } else {
      showMessage('error', 'Failed to delete content');
    }
  } catch (error) {
    showMessage('error', 'Network error');
  }
}

async function deleteCategory(id) {
  if (!confirm('Are you sure you want to delete this category?')) return;
  
  try {
    const response = await fetch(`/api/categories/${id}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      }
    });
    
    if (response.ok) {
      showMessage('success', 'Category deleted successfully');
      loadCategories();
    } else {
      showMessage('error', 'Failed to delete category');
    }
  } catch (error) {
    showMessage('error', 'Network error');
  }
}

async function deleteArchive(id) {
  if (!confirm('Are you sure you want to delete this archive item?')) return;
  
  try {
    const response = await fetch(`/api/archive/${id}`, {
      method: 'DELETE',
      headers: {
        'Authorization': `Bearer ${localStorage.getItem('token')}`
      }
    });
    
    if (response.ok) {
      showMessage('success', 'Archive item deleted successfully');
      loadArchive();
    } else {
      showMessage('error', 'Failed to delete archive item');
    }
  } catch (error) {
    showMessage('error', 'Network error');
  }
}

// Initialize
if (checkAuth()) {
  loadCategories();
  loadContent();
  loadArchive();
}
</script>

</body>
</html>
